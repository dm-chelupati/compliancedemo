# ============================================================
# GitHub Actions — Build & Push to ACR
# CI/CD image-build workflow for the Container App.
#
# This workflow builds images with immutable compliance labels and pushes them
# to ACR. It does not update Container App revisions. Configure and validate a
# separate approved deployment component before treating an image push as a
# compliant deployment.
#
# Compliance signal:
#   - Docker image labels: commit-sha, pipeline-run-id, branch, and repository
#     (immutable once pushed to ACR)
#
# Required secrets:
#   ACR_USERNAME / ACR_PASSWORD  — ACR admin credentials
# Required variable:
#   ACR_NAME — Target ACR name without .azurecr.io
# ============================================================
name: Build and Push Container Image

on:
  push:
    branches: [main]
    paths:
      - 'src/api/**'
      - '.github/workflows/deploy-container-app.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ACR_NAME: ${{ vars.ACR_NAME }}
  IMAGE_NAME: compliance-demo-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | \
            docker login "${{ env.ACR_NAME }}.azurecr.io" \
              -u "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: Build and push image
        run: |
          SHA_TAG="${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          LATEST_TAG="${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest"

          # Immutable compliance labels — baked into the image, can't be tampered
          docker build \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "deployed-by=pipeline" \
            --label "pipeline-run-id=${{ github.run_id }}" \
            --label "commit-sha=${{ github.sha }}" \
            --label "branch=${{ github.ref_name }}" \
            --label "repository=${{ github.repository }}" \
            --label "workflow=${{ github.workflow }}" \
            -t "$SHA_TAG" \
            -t "$LATEST_TAG" \
            src/api/

          # Publish immutable and convenience tags. Deployment occurs separately.
          docker push "$SHA_TAG"
          docker push "$LATEST_TAG"
          echo "Pushed: $SHA_TAG"
          echo "A separate approved deployment component must update the Container App."

      - name: Summary
        run: |
          echo "### Image Pushed to ACR" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Container App deployment**: Not performed by this workflow" >> $GITHUB_STEP_SUMMARY
