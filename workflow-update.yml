# ============================================================
# GitHub Actions - Build, push, and deploy to Azure Container Apps
#
# The approved CI/CD service principal performs the Container App update.
# The workflow builds an immutable SHA-tagged image, pushes it to ACR, and
# stamps matching deployment tags after the image update succeeds.
#
# Required secrets:
#   ACR_USERNAME / ACR_PASSWORD - ACR admin credentials for image push
#   AZURE_CREDENTIALS            - approved CI/CD service principal JSON
# Required repository variables:
#   ACR_NAME, RESOURCE_GROUP, CONTAINER_APP_NAME
# ============================================================
name: Deploy Container App

on:
  push:
    branches: [main]
    paths:
      - 'src/api/**'
      - '.github/workflows/deploy-container-app.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ACR_NAME: ${{ vars.ACR_NAME }}
  IMAGE_NAME: compliance-demo-api
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
  CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        run: |
          test -n "$ACR_NAME"
          test -n "$RESOURCE_GROUP"
          test -n "$CONTAINER_APP_NAME"

      - name: Sign in with the approved CI/CD identity
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | \
            docker login "${{ env.ACR_NAME }}.azurecr.io" \
              -u "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: Build and push image
        run: |
          SHA_TAG="${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          LATEST_TAG="${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest"

          # Immutable compliance labels — baked into the image, can't be tampered
          docker build \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "deployed-by=pipeline" \
            --label "pipeline-run-id=${{ github.run_id }}" \
            --label "commit-sha=${{ github.sha }}" \
            --label "branch=${{ github.ref_name }}" \
            --label "repository=${{ github.repository }}" \
            --label "workflow=${{ github.workflow }}" \
            -t "$SHA_TAG" \
            -t "$LATEST_TAG" \
            src/api/

          docker push "$SHA_TAG"
          docker push "$LATEST_TAG"
          echo "Pushed: $SHA_TAG"

      - name: Deploy immutable image
        run: |
          SHA_TAG="${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$SHA_TAG" \
            --output none

          APP_ID="$(az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" --query id --output tsv)"
          az tag update \
            --resource-id "$APP_ID" \
            --operation Merge \
            --tags "deployed-by=pipeline" "pipeline-run-id=${{ github.run_id }}" "commit-sha=${{ github.sha }}" "branch=${{ github.ref_name }}" "repository=${{ github.repository }}" "workflow=${{ github.workflow }}" \
            --output none

      - name: Summary
        run: |
          echo "### Container App deployed" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment**: Direct Container App update by the approved CI/CD identity" >> $GITHUB_STEP_SUMMARY
