# ============================================================
# GitHub Actions — Build & Push to ACR
# CI/CD pipeline for compliant deployments to Azure Container App.
#
# How it works:
# 1. Builds a Docker image with immutable compliance labels
# 2. Pushes it to the ACR named by the repository variable ACR_NAME
# 3. Leaves deployment orchestration to whatever follow-on step the environment provides
#
# Compliance signals (tamper-proof):
#   - Docker image labels: commit-sha, pipeline-run-id, branch, repo
#     (immutable once pushed to ACR)
#
# Required secrets and variables:
#   ACR_USERNAME / ACR_PASSWORD  — ACR admin credentials
#   ACR_NAME                     — ACR name without .azurecr.io
# ============================================================
name: Deploy Container App

on:
  push:
    branches: [main]
    paths:
      - 'src/api/**'
      - '.github/workflows/deploy-container-app.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ACR_NAME: ${{ vars.ACR_NAME }}
  IMAGE_NAME: compliance-demo-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | \
            docker login "${{ env.ACR_NAME }}.azurecr.io" \
              -u "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: Build and push image
        run: |
          SHA_TAG="${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          LATEST_TAG="${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest"

          # Immutable compliance labels — baked into the image, can't be tampered
          docker build \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "deployed-by=pipeline" \
            --label "pipeline-run-id=${{ github.run_id }}" \
            --label "commit-sha=${{ github.sha }}" \
            --label "branch=${{ github.ref_name }}" \
            --label "repository=${{ github.repository }}" \
            --label "workflow=${{ github.workflow }}" \
            -t "$SHA_TAG" \
            -t "$LATEST_TAG" \
            src/api/

          # Push the immutable SHA-tagged image first.
          docker push "$SHA_TAG"
          # Push :latest as a convenience tag as well.
          docker push "$LATEST_TAG"
          echo "Pushed: $SHA_TAG"
          echo "Image is available in ACR for whatever deployment step the environment uses"

      - name: Summary
        run: |
          echo "### Image Pushed to ACR" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Next step**: verify that this environment has a deployment path from ACR to the Container App" >> $GITHUB_STEP_SUMMARY
